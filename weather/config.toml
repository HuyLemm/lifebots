# Bot thời tiết: chỉnh ở đây, không cần sửa code.
interval_seconds = 300          # kiểm tra mỗi 5 phút (báo cáo đúng giờ, bất thường báo ngay)
place = "TP.HCM"
latitude = 10.78
longitude = 106.70

# Mỗi ngày gửi thời tiết hiện tại + tỉ lệ mưa vào các giờ này (giờ máy, 0-23)
