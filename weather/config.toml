heat_c = 38                     # nhiệt độ cảm giác cao nhất >= 38°C -> nắng nóng
cold_c = 18                     # thấp nhất <= 18°C -> trời lạnh (TP.HCM hiếm khi tới)
uv_alert = 8                    # UV >= 8
wind_kmh = 40                   # gió >= 40 km/h
temp_swing_c = 5                # nhiệt độ cao nhất lệch hôm qua >= 5°C
aqi_alert = 150                 # AQI (US) >= 150 (xấu)
cooldown_hours = 4              # "sắp mưa"/AQI không lặp lại trong 4 giờ
