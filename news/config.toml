# Bot tin: chỉnh ở đây, không cần sửa code.
# Mỗi nguồn: name, url, topic (tech/world/economy/crime), priority (1 = gửi trước),
# keywords (bỏ trống = báo mọi bài mới của nguồn đó).
interval_seconds = 300          # kiểm tra mỗi lượt chạy (~5 phút, nhanh nhất lịch GitHub cho phép)
max_per_run = 30                # tối đa mỗi lượt; công nghệ được gửi trước, phần dư gửi lượt sau
digest_over = 0                 # 0 = mỗi tin một tin nhắn riêng (có ảnh); đặt số > 0 để gộp khi dồn tin

# Tóm tắt 1-2 câu bằng AI dưới tiêu đề. MẶC ĐỊNH TẮT. Bật = enabled = true VÀ đặt secret
# ANTHROPIC_API_KEY (GitHub Secrets / .env của bot news). Lỗi gì thì tin vẫn gửi bình thường.
[ai]
enabled = false
model = "claude-haiku-5-5"
max_per_run = 10                # tối đa số tin được tóm tắt mỗi lượt (tiết kiệm chi phí)

